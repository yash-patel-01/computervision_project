# Configuration file for football tracking model

# Model parameters
model:
  num_classes: 3  # background, player, ball
  pretrained: true
  trainable_backbone_layers: 3

# Training parameters
training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 10
  lr_gamma: 0.1
  num_workers: 4

# Data parameters
data:
  train_data_dir: 'data/train/images'
  train_annotations: 'data/train/annotations.json'
  val_data_dir: 'data/val/images'
  val_annotations: 'data/val/annotations.json'

# Inference parameters
inference:
  confidence_threshold: 0.5
  skip_frames: 1  # For video inference

# Paths
paths:
  checkpoint_dir: 'checkpoints'
  log_dir: 'runs'

# Classes
classes:
  - background
  - player
  - ball
